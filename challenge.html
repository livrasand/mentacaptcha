<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Verifying you are human · Menta</title>
<meta name="description" content="A quick proof-of-work check to confirm you are human. No cookies, no tracking, no image puzzles.">
<link rel="icon" type="image/svg+xml" href="/menta-logo.svg">
<link rel="stylesheet" href="/css/global.css">
<script src="/js/header.js" defer></script>
<style>
  .challenge-wrap {
    min-height: calc(100vh - 64px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--padding-8x) var(--padding-6x);
    box-sizing: border-box;
  }
  .challenge-card {
    background: var(--color-card);
    border: 1px solid var(--border-color);
    border-radius: var(--border-radius);
    padding: var(--padding-8x);
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-sizing: border-box;
  }
  .challenge-spinner {
    width: var(--spinner-size);
    height: var(--spinner-size);
    margin: 0 auto var(--padding-6x);
    border: 3px solid var(--border-color);
    border-top-color: var(--color-primary);
    border-radius: 50%;
    animation: challenge-spin 0.8s linear infinite;
  }
  @keyframes challenge-spin { to { transform: rotate(360deg); } }
  .challenge-error { color: var(--color-error); }
  .challenge-ok { color: var(--color-primary); }
</style>
</head>
<body>

{% include 'nav.html' %}

<main class="challenge-wrap" style="flex-direction: column;">
  <div class="challenge-card">
    <div id="spinner" class="challenge-spinner" aria-hidden="true"></div>
    <h1 style="font-size: 1.35rem; margin: 0 0 var(--padding-4x); font-weight: 700; line-height: 1.3;" id="heading">Verifying you are human</h1>
    <p id="status" style="color: var(--value-color); margin: 0 0 var(--padding-4x); font-size: 0.95rem;">This is a quick proof-of-work check. No cookies, no tracking, no puzzles to solve.</p>
    <p id="meta" style="color: var(--value-color); font-size: var(--font-size-small); margin: 0 0 var(--padding-6x); min-height: 1.2em;"></p>
    <button id="retry" class="button" type="button" style="display: none;">Try again</button>
    <p style="color: var(--value-color); font-size: var(--font-size-small); margin: var(--padding-6x) 0 0;">Performance test by <a href="https://github.com/livrasand/mentacaptcha" target="_blank" rel="noopener">Menta</a> &middot; privacy-first CAPTCHA</p>
  </div>
</main>

<script>
(function () {
  'use strict'

  var statusEl = document.getElementById('status')
  var metaEl = document.getElementById('meta')
  var spinnerEl = document.getElementById('spinner')
  var retryEl = document.getElementById('retry')

  function setStatus (message, kind) {
    if (statusEl) {
      statusEl.textContent = message
      statusEl.classList.toggle('challenge-error', kind === 'error')
      statusEl.classList.toggle('challenge-ok', kind === 'ok')
    }
  }

  function setMeta (message) {
    if (metaEl) metaEl.textContent = message
  }

  function showSpinner (on) {
    if (spinnerEl) spinnerEl.style.display = on ? '' : 'none'
  }

  function showRetry (on) {
    if (retryEl) retryEl.style.display = on ? '' : 'none'
  }

  function setHeading (message) {
    var headingEl = document.getElementById('heading')
    if (headingEl) headingEl.textContent = message
  }

  var sameOriginPattern = /^\/(?![a-z][a-z0-9+\-.]*:|\/\/|\\)/i
  var params = new URLSearchParams(window.location.search)
  var next = params.get('next') || '/'
  if (!sameOriginPattern.test(next) || next.length > 2048) next = '/'

  if (!window.crypto || !crypto.subtle) {
    if (window.isSecureContext === true || window.isSecureContext === undefined) {
      showSpinner(false)
      showRetry(false)
      setStatus('This check requires a browser with JavaScript and Web Crypto enabled.', 'error')
      return
    }
  }
  if (window.isSecureContext !== true && window.isSecureContext !== undefined) {
    showSpinner(false)
    showRetry(false)
    setStatus('An HTTPS connection is needed to run this security check.', 'error')
    return
  }

  function fetchJSON (url, body) {
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (res) {
      return res.json().catch(function () { return null }).then(function (data) {
        return { status: res.status, data: data }
      })
    })
  }

  function storeClearance (clearanceToken) {
    try {
      localStorage.setItem('menta_shield_clearance', JSON.stringify({
        token: clearanceToken,
        ts: Date.now()
      }))
    } catch (e) { /* private mode */ }
  }

  function goNext () {
    location.replace(next)
  }

  function failReject (label) {
    return function () {
      showSpinner(false)
      showRetry(true)
      setHeading('Something went wrong')
      setStatus(label || 'We could not complete the check. Please try again.', 'error')
      setMeta('')
    }
  }

  function progressLabel (hashes, seconds) {
    var count = new Intl.NumberFormat('en-US').format(Math.max(0, Math.floor(hashes)))
    return count + ' hashes in ' + seconds.toFixed(1) + ' s …'
  }

  function solve (challenge, solveCtx) {
    var salt = challenge.salt
    var target = challenge.target
    var encoder = new TextEncoder()
    var t0 = Date.now()
    var nonce = 0
    var hashes = 0
    var difficulty = target.length

    setMeta('Difficulty: ' + difficulty + ' leading zeros.')

    function step () {
      if (Date.now() - t0 > 110000) {
        return Promise.reject(new Error('timeout'))
      }
      return crypto.subtle.digest('SHA-256', encoder.encode(salt + String(nonce))).then(function (digest) {
        var bytes = new Uint8Array(digest)
        var i
        var ok = true
        for (i = 0; i < target.length; i++) {
          var want = target.charCodeAt(i) <= 57 ? target.charCodeAt(i) - 48 : target.charCodeAt(i) - 87
          var got = (bytes[i >> 1] >> ((i & 1) ? 4 : 0)) & 0xF
          if (got !== want) { ok = false; break }
        }
        hashes++
        if (ok) {
          solveCtx.elapsed = (Date.now() - t0) / 1000
          solveCtx.hashes = hashes
          return String(nonce)
        }
        nonce++
        if ((hashes & 1023) === 0) {
          setMeta(progressLabel(hashes, (Date.now() - t0) / 1000))
        }
        return step()
      })
    }
    return step()
  }

  function run () {
    showSpinner(true)
    showRetry(false)
    setHeading('Verifying you are human')
    setStatus('Checking your browser…', '')
    if (metaEl) metaEl.textContent = ''

    fetchJSON('/shield/check', {
      path: next,
      url: window.location.href,
      force: true
    }).then(function (r1) {
      if (r1.status === 429) {
        showSpinner(false)
        setStatus('Too many requests. Please wait a moment and try again.', 'error')
        return
      }
      var data = r1.data || {}
      if (data.action === 'block') {
        showSpinner(false)
        setHeading('Access denied')
        setStatus('Sorry, you are blocked from accessing this resource.', 'error')
        setMeta('')
        showRetry(false)
        return
      }
      if (data.action === 'shield' && data.challenge) {
        setStatus('Solving a challenge in your browser…', '')
        var ctx = {}
        return solve(data.challenge, ctx).then(function (nonce) {
          return fetchJSON('/shield/redeem', {
            token: data.token,
            solutions: nonce,
            challenge_signature: data.challenge.challenge_signature
          }).then(function (r2) {
            if (r2.data && r2.data.success && r2.data.clearance_token) {
              storeClearance(r2.data.clearance_token)
              if (metaEl) {
                metaEl.textContent = 'Proof completed in ' + ctx.elapsed.toFixed(2) + ' s (' + new Intl.NumberFormat('en-US').format(ctx.hashes) + ' hashes).'
              }
              setHeading('Verification complete')
              setStatus('Success! Redirecting…', 'ok')
              showSpinner(false)
              setMeta('')
              window.setTimeout(goNext, 1200)
              return
            }
            return Promise.reject(r2.data && r2.data.error)
          })
        }, function () { return Promise.reject('The challenge took too long to solve. Please try again.') })
      }
      showSpinner(false)
      showRetry(true)
      setHeading('Verification not required')
      setStatus('No challenge was required. Try opening the destination site directly.', '')
      if (metaEl) metaEl.textContent = ''
    }, failReject())
  }

  var retryButton = document.getElementById('retry')
  if (retryButton) retryButton.addEventListener('click', run)
  run()
})()
</script>

</body>
</html>
